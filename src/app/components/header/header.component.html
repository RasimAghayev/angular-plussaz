<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/posts-list">{{ title }}</a>
    <div class="d-flex align-items-center gap-2">
      @if (session.isSignedIn()) {
        <span class="text-light small">{{ session.user()?.name }}</span>
        <a class="btn btn-outline-primary" routerLink="/posts-add">New post</a>
        <button type="button" class="btn btn-outline-danger" (click)="signOut()">Sign out</button>
      } @else {
        <a class="btn btn-outline-success" routerLink="/login">Sign in</a>
      }
    </div>
  </div>
</nav>
